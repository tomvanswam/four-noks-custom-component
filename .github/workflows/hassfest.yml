name: Hassfest

on:
  push:
    branches-ignore:
      - main
  pull_request:
  schedule:
    - cron: "11 3 * * *"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Hassfest
        uses: "home-assistant/actions/hassfest@master"
