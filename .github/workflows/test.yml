name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 */7 * *"

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements_dev.txt

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ -v 2>&1 | tee test_output.log || {
            echo "## Test Failure Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
