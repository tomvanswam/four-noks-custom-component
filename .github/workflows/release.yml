name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Hassfest
        uses: "home-assistant/actions/hassfest@master"

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_lint.txt

      - name: Run Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    container:
      image: ghcr.io/home-assistant/home-assistant:dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          pip install --no-cache-dir pytest-asyncio

      - name: Run tests
        run: |
          pytest tests/ -v

  release:
    name: Create Release
    needs: [hacs, hassfest, lint, test]
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Determine next version and generate release notes
        id: release_prep
        run: |
          python scripts/release.py \
            --manifest custom_components/four_noks/manifest.json \
            --notes-output release_notes.md \
            --repo-url "${{ github.server_url }}/${{ github.repository }}"

      - name: Configure Git
        if: steps.release_prep.outputs.has_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit updated manifest and push tag
        if: steps.release_prep.outputs.has_release == 'true'
        run: |
          git add custom_components/four_noks/manifest.json
          git commit -m "chore(release): ${{ steps.release_prep.outputs.tag_name }} [skip ci]"
          git tag -a "${{ steps.release_prep.outputs.tag_name }}" -m "Release ${{ steps.release_prep.outputs.tag_name }}"
          git push origin main
          git push origin "${{ steps.release_prep.outputs.tag_name }}"

      - name: Create integration zip archive
        if: steps.release_prep.outputs.has_release == 'true'
        run: |
          cd custom_components
          zip -r ../four_noks.zip four_noks
          cd ..

      - name: Create GitHub Release
        if: steps.release_prep.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release_prep.outputs.tag_name }}" \
            four_noks.zip \
            --title "${{ steps.release_prep.outputs.tag_name }}" \
            --notes-file release_notes.md
